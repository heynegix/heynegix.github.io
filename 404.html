<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>404 — Page not found | Negix</title>
    <link rel="icon" type="image/png" href="favicon.png" />
    <style>
      :root {
        color-scheme: dark;
        background: #000;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
        margin: 0;
        background: #000;
      }

      body {
        display: grid;
        min-height: 100vh;
        place-items: center;
      }

      main {
        width: 100%;
        height: 100vh;
        display: grid;
        place-items: center;
        overflow: hidden;
      }

      img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
      }

      a {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
      }

      a:focus {
        width: auto;
        height: auto;
        clip: auto;
        padding: 8px 12px;
        background: #fff;
        color: #000;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="404.png" alt="404. Page not found. Looks like this page doesn't exist." />
      <a href="/">Return to homepage</a>
    </main>
  </body>
</html>
